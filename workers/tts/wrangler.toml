name = "musk-atlas-tts"
main = "src/index.ts"
compatibility_date = "2026-10-01"
account_id = "be75f707c7a89362cba8a01e5538b7f8"
workers_dev = true

[vars]
VOICE = "rex"
# Max new characters synthesized per UTC day (cost cap: 200k chars ≈ $3 at $15 / 1M chars).
DAILY_CHARS = "200000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "musk-atlas-clips"

# Secret (not in this file): XAI_API_KEY — `npx wrangler secret put XAI_API_KEY`
# Secret (not in this file): CACHE_JOB_SECRET — `npx wrangler secret put CACHE_JOB_SECRET`
# The full-video downloader is scripts/musk/cache_full.py on a machine you run.
# This Worker only stores the job and checks the uploaded object. It does not download YouTube.
