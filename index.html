<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1120" />
    <meta name="twitter:title" content="词光 · 一词一画，点亮雅思" />
    <title>Musk Atlas · 他怎么说这个词</title>
    <meta name="description" content="7,298 个雅思核心词，每个词一幅原创插画、两句原创例句和英美发音。学会一个，就点亮一颗星。免费、开源、无需注册。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="词光 · 一词一画，点亮雅思" />
    <meta property="og:description" content="7,298 个雅思词，每个都有一幅画。学会一个，就点亮一颗星。免费、开源、无需注册。" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" href="%BASE_URL%atlas/index.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Apply the saved theme (dark by default) before first paint.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If this HTML is older than version.json, load the new document once.
      // sessionStorage only remembers the attempt. Learning data stays in localStorage.
      (function () {
        var current = document.querySelector('script[type="module"]');
        var src = current ? current.getAttribute("src") || "" : "";
        var rootMatch = src.match(/^(.*\/)assets\/[^/]+\.js$/);
        var root = rootMatch ? rootMatch[1] : "/";
        fetch(root + "version.json?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : null;
          })
          .then(function (data) {
            var remote = data && typeof data.js === "string" ? data.js : "";
            if (!remote || remote.indexOf("..") !== -1 || !/\.js$/.test(remote) || /[\s"'<>]/.test(remote)) return;
            if (src.indexOf(remote) !== -1) return;
            var key = "musk-atlas:reload-for";
            if (sessionStorage.getItem(key) === remote) return;
            sessionStorage.setItem(key, remote);
            var url = new URL(location.href);
            url.searchParams.set("v", (remote.split("/").pop() || "next").replace(/[^a-zA-Z0-9._-]/g, ""));
            location.replace(url.toString());
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
